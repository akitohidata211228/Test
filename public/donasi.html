<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donasi | LǐRénXīn API</title>

    <meta name="description" content="Dukung LǐRénXīn API lewat QRIS. Scan, bayar, selesai — biaya server jalan terus.">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="robots" content="noindex, follow">

    <link rel="canonical" href="https://lirenxin-api.my.id/donasi">
    <link rel="icon" href="/src/danzz.jpg">

    <script src="theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                        display: ['"Space Mono"', 'monospace']
                    },
                    colors: {
                        brand: 'var(--brand)',
                        'brand-strong': 'var(--brand-strong)',
                        ink: 'var(--ink)',
                        'ink-soft': 'var(--ink-soft)',
                        'ink-faint': 'var(--ink-faint)',
                        surface: 'var(--surface)',
                        'surface-sunk': 'var(--surface-sunk)',
                        line: 'var(--line)',
                        'line-soft': 'var(--line-soft)'
                    }
                }
            }
        }
    </script>
</head>
<body class="grid-bg min-h-screen flex items-center justify-center font-mono p-4 text-ink">

    <div id="custom-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4" role="alertdialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="panel w-full max-w-xs animate-pop overflow-hidden">
            <div class="px-3 py-2 border-b-2 flex items-center gap-2 text-white" style="border-color: var(--line); background: #ef4444;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <h2 id="modal-title" class="font-display font-bold text-base">PERHATIAN</h2>
            </div>
            <div class="p-5 text-center">
                <p id="modal-message" class="font-bold text-sm mb-5 leading-relaxed text-ink-soft">Pesan error di sini.</p>
                <button onclick="closeModal()"
                    class="press w-full text-white py-2 font-bold text-sm border-2 rounded"
                    style="border-color: var(--line); background: var(--brand); box-shadow: var(--shadow-sm);">
                    MENGERTI
                </button>
            </div>
        </div>
    </div>

    <main class="panel w-full max-w-[360px] md:max-w-2xl overflow-hidden flex flex-col animate-rise">

        <header class="px-4 py-3 flex justify-between items-center border-b-2"
                style="border-color: var(--line); background: linear-gradient(90deg, var(--brand), var(--sky));">
            <h1 class="font-display font-bold text-xl tracking-tighter italic text-white">DONASI</h1>
            <div class="flex items-center gap-2">
                <button onclick="flipTheme(this)" title="Ganti tema" aria-label="Ganti tema"
                    class="w-8 h-8 rounded border border-white/40 bg-white/15 text-white hover:bg-white/30 transition-colors flex items-center justify-center">
                    <i class="fa-solid fa-moon text-[11px]"></i>
                </button>
                <a href="/" class="press text-[10px] font-bold border-2 px-3 py-1.5 rounded no-underline"
                   style="border-color: var(--line); background: var(--surface); color: var(--brand); box-shadow: var(--shadow-sm);">
                    HOME
                </a>
            </div>
        </header>

        <div class="p-4 md:p-6 flex-grow flex flex-col justify-center">

            <div id="input-section" class="w-full flex flex-col md:flex-row md:items-stretch gap-4 md:gap-6">

                <div class="w-full md:w-5/12 flex">
                    <div class="relative w-full aspect-square md:aspect-auto border-2 rounded-lg overflow-hidden group min-h-[200px]"
                         style="border-color: var(--line-soft); background: var(--surface-sunk);">
                        <img src="https://c.termai.cc/i111/TJHiBPf.jpg" alt="Zhao Lusi"
                             loading="lazy"
                             class="w-full h-full object-cover grayscale transition-all duration-500 group-hover:grayscale-0 group-hover:scale-105">
                    </div>
                </div>

                <div class="w-full md:w-7/12 flex flex-col justify-between gap-3">
                    <div class="space-y-3">
                        <div>
                            <label for="input-name" class="block font-bold text-[10px] uppercase tracking-wider mb-1.5 text-ink-faint">
                                Nama Pengirim
                            </label>
                            <input type="text" id="input-name" placeholder="Hamba Allah" autocomplete="name" class="field">
                        </div>

                        <div>
                            <span class="block font-bold text-[10px] uppercase tracking-wider mb-1.5 text-ink-faint">
                                Nominal Donasi
                            </span>
                            <div class="grid grid-cols-3 gap-2 mb-2">
                                <button type="button" onclick="setVal(5000)" class="press border-2 py-1.5 text-[10px] font-bold rounded"
                                    style="border-color: var(--line-soft); background: var(--surface-sunk); color: var(--brand);">5k</button>
                                <button type="button" onclick="setVal(10000)" class="press border-2 py-1.5 text-[10px] font-bold rounded"
                                    style="border-color: var(--line-soft); background: var(--surface-sunk); color: var(--brand);">10k</button>
                                <button type="button" onclick="setVal(25000)" class="press border-2 py-1.5 text-[10px] font-bold rounded"
                                    style="border-color: var(--line-soft); background: var(--surface-sunk); color: var(--brand);">25k</button>
                            </div>
                            <div class="relative">
                                <span class="absolute left-0 top-0 bottom-0 w-10 flex items-center justify-center text-white font-bold z-10 text-sm rounded-l"
                                      style="background: var(--brand);" aria-hidden="true">Rp</span>
                                <label for="input-amount" class="sr-only">Nominal donasi dalam rupiah</label>
                                <input type="number" id="input-amount" inputmode="numeric" min="1000" step="1000"
                                       placeholder="1.000" class="field pl-12 text-base font-bold">
                            </div>
                        </div>
                    </div>

                    <button onclick="createTransaction()" id="btn-pay"
                        class="press w-full text-white py-3.5 font-bold text-sm border-2 rounded-lg disabled:opacity-70 disabled:cursor-not-allowed"
                        style="border-color: var(--line); background: linear-gradient(90deg, var(--brand), var(--sky)); box-shadow: var(--shadow);">
                        <span id="btn-text">LANJUT BAYAR <i class="fa-solid fa-arrow-right ml-1"></i></span>
                        <span id="btn-loader" class="hidden"><i class="fa-solid fa-circle-notch fa-spin"></i> LOADING...</span>
                    </button>
                </div>
            </div>

            <div id="result-section" class="hidden w-full flex-col md:flex-row gap-4 md:gap-6">

                <div class="w-full md:w-5/12 flex flex-col gap-2">
                    <p class="w-full border-2 border-dashed rounded p-1.5 text-[10px] font-bold text-center"
                       style="border-color: var(--line-soft); background: var(--brand-wash); color: var(--brand);">
                        SCAN QRIS INI
                    </p>
                    <div class="p-2 border-2 rounded-lg aspect-square flex items-center justify-center bg-white"
                         style="border-color: var(--line); box-shadow: var(--shadow-sm);">
                        <div id="qrcode" class="flex justify-center items-center w-full h-full"></div>
                    </div>
                </div>

                <div class="w-full md:w-7/12 flex flex-col gap-3 justify-center">
                    <div class="w-full border-2 rounded-lg p-4 flex flex-col gap-2"
                         style="border-color: var(--line-soft); background: var(--surface-sunk); box-shadow: var(--shadow-sm);">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-ink-faint">Total Tagihan</span>
                            <span class="text-xl font-display font-bold" id="display-amount" style="color: var(--brand);">Rp 0</span>
                        </div>
                        <div class="flex justify-between items-center border-t-2 border-dashed pt-2" style="border-color: var(--line-soft);">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-ink-faint">Berlaku Sampai</span>
                            <span class="text-xs font-bold text-ink" id="display-expire">--:--</span>
                        </div>
                    </div>

                    <button onclick="resetForm()"
                        class="press w-full py-3 font-bold border-2 rounded-lg text-xs flex items-center justify-center gap-2"
                        style="border-color: var(--line-soft); background: var(--surface); color: #ef4444; box-shadow: var(--shadow-sm);">
                        <i class="fa-solid fa-xmark"></i> BATALKAN TRANSAKSI
                    </button>
                </div>
            </div>

            <div id="success-section" class="hidden flex-col items-center justify-center text-center w-full py-6 md:py-10">
                <div class="text-white rounded-full w-24 h-24 flex items-center justify-center border-2 mb-6"
                     style="border-color: var(--line); background: #22c55e; box-shadow: var(--shadow);">
                    <i class="fa-solid fa-check text-5xl"></i>
                </div>

                <h2 class="font-display font-bold text-3xl mb-2 tracking-tight italic text-ink">ARIGATO!</h2>
                <p class="text-sm font-bold mb-8 max-w-xs mx-auto text-ink-faint">Terima kasih orang baik, donasi kamu sudah berhasil diterima.</p>

                <button onclick="resetForm()"
                    class="press w-full max-w-xs text-white py-3 font-bold text-sm border-2 rounded-lg"
                    style="border-color: var(--line); background: var(--brand); box-shadow: var(--shadow-sm);">
                    KEMBALI DONASI
                </button>
            </div>

        </div>

        <footer class="px-4 py-2 border-t-2 text-center" style="border-color: var(--line-soft); background: var(--surface-sunk);">
            <span class="text-[10px] font-bold uppercase tracking-wider text-ink-faint">Powered by LǐRénXīn API</span>
        </footer>
    </main>

    <script>
        function flipTheme(btn) {
            const mode = window.LirenxinTheme.toggle();
            btn.querySelector('i').className = mode === 'dark'
                ? 'fa-solid fa-sun text-[11px]'
                : 'fa-solid fa-moon text-[11px]';
        }

        (function syncThemeIcon() {
            const icon = document.querySelector('header button i');
            if (icon && window.LirenxinTheme.current() === 'dark') {
                icon.className = 'fa-solid fa-sun text-[11px]';
            }
        })();

        let timerInterval, expireTime;
        const LS_KEY = 'lirenxin-donation-session';

        function setVal(n) {
            document.getElementById('input-amount').value = n;
        }

        function showModal(message) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-message').innerText = message;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });

        function switchView(id) {
            ['input-section', 'result-section', 'success-section'].forEach(v => {
                const el = document.getElementById(v);
                const active = v === id;
                el.classList.toggle('hidden', !active);
                el.classList.toggle('flex', active);
                el.classList.toggle('animate-pop', active);
            });
        }

        function toggleLoading(isLoading) {
            document.getElementById('btn-pay').disabled = isLoading;
            document.getElementById('btn-text').classList.toggle('hidden', isLoading);
            document.getElementById('btn-loader').classList.toggle('hidden', !isLoading);
        }

        function checkSession() {
            const saved = localStorage.getItem(LS_KEY);
            if (!saved) return false;
            try {
                const data = JSON.parse(saved);
                if (Date.now() > data.expireTime) {
                    localStorage.removeItem(LS_KEY);
                    return false;
                }
                expireTime = data.expireTime;
                renderQR(data.qr_string, data.amount);
                startTimer();
                switchView('result-section');
                return true;
            } catch (e) {
                localStorage.removeItem(LS_KEY);
                return false;
            }
        }

        function renderQR(qrString, amount) {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
                text: qrString,
                width: 180, height: 180,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.L
            });
            document.getElementById('display-amount').innerText = 'Rp ' + parseInt(amount).toLocaleString('id-ID');
        }

        async function createTransaction() {
            const amount = document.getElementById('input-amount').value;
            const name = document.getElementById('input-name').value || 'Hamba Allah';

            if (!amount || parseInt(amount) < 1000) {
                showModal('Minimal donasi Rp 1.000 ya kak!');
                return;
            }

            toggleLoading(true);

            try {
                const response = await fetch('/api/create-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount, name })
                });

                const data = await response.json();
                toggleLoading(false);

                if (data.status === 'success') {
                    expireTime = data.expired_at;
                    localStorage.setItem(LS_KEY, JSON.stringify({
                        order_id: data.order_id,
                        amount: data.amount,
                        qr_string: data.qr_string,
                        expireTime
                    }));
                    renderQR(data.qr_string, data.amount);
                    startTimer();
                    switchView('result-section');
                } else {
                    showModal(data.message || 'Terjadi kesalahan pada server.');
                }
            } catch (error) {
                toggleLoading(false);
                showModal('Gagal menghubungi server. Cek koneksi internet.');
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const display = document.getElementById('display-expire');

            const tick = () => {
                const left = Math.ceil((expireTime - Date.now()) / 1000);
                if (left <= 0) {
                    resetForm();
                    showModal('Waktu habis, silakan buat transaksi baru.');
                    return;
                }
                const m = String(Math.floor(left / 60)).padStart(2, '0');
                const s = String(left % 60).padStart(2, '0');
                display.innerText = `${m}:${s}`;
            };

            tick();
            timerInterval = setInterval(tick, 1000);
        }

        function resetForm() {
            clearInterval(timerInterval);
            localStorage.removeItem(LS_KEY);
            document.getElementById('input-amount').value = '';
            document.getElementById('qrcode').innerHTML = '';
            switchView('input-section');
        }

        if (!checkSession()) switchView('input-section');
    </script>
</body>
</html>
