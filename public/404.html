<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — Route Tidak Ditemukan | LǐRénXīn API</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0b0d10">

    <link rel="icon" href="/src/danzz.jpg">
    <script src="theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
        <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    </svg>
</head>
<body>

    <main class="err-wrap">
        <div class="card err-card">
            <svg width="26" height="26" style="color:var(--ink-faint);" aria-hidden="true"><use href="#i-search"/></svg>
            <p class="err-code">404</p>
            <h1 style="font-size:16px; font-weight:600; margin:0;">Route tidak ditemukan</h1>
            <p style="font-size:13.5px; color:var(--ink-soft); line-height:1.65; margin:8px 0 0;">
                Endpoint yang kamu tuju nggak ada di daftar. Mungkin salah ketik,
                atau sudah dipindah ke path lain.
            </p>

            <code class="err-path" id="req-path">/</code>

            <div class="err-actions">
                <a href="/" class="btn btn-primary btn-sm">Kembali ke beranda</a>
                <a href="/docs" class="btn btn-ghost btn-sm">Cek dokumentasi</a>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('req-path').textContent = location.pathname + location.search;
        document.body.classList.add('fade-in');
    </script>
</body>
</html>
