<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — Route Tidak Ditemukan | LiRénXin API</title>
    <meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0F0E0C">

    <link rel="icon" href="/src/danzz.jpg">
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
        <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
    </svg>
</head>
<body>

    <header class="nav">
        <div class="container nav-in">
            <a class="brand" href="/" aria-label="LiRénXin API — beranda">lirenxin<span class="dash">-</span>api</a>
            <div>
                <a class="nav-link" href="/docs">Dokumentasi</a>
                <button class="icon-btn" onclick="flipTheme()" title="Ganti tema" aria-label="Ganti tema">
                    <svg class="icon-sun" viewBox="0 0 24 24"><use href="#i-sun"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24"><use href="#i-moon"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="err-wrap">
        <section class="container">
            <p class="kick">// rute nggak ada</p>
            <div class="err-code">404</div>
            <h1 class="err-title">Yang kamu tuju beda alamat.</h1>
            <p class="err-p">
                Endpoint yang kamu cari nggak ada di daftar. Mungkin salah ketik,
                atau sudah dipindah ke path lain.
            </p>

            <code class="err-path" id="req-path">/</code>

            <div class="err-actions">
                <a href="/" class="btn btn-primary btn-sm">Kembali ke beranda</a>
                <a href="/docs" class="btn btn-ghost btn-sm">Cek dokumentasi</a>
            </div>
        </section>
    </main>

    <script>
        window.flipTheme = window.LirenxinTheme.toggle;
        document.getElementById('req-path').textContent = location.pathname + location.search;
        document.body.classList.add('fade-in');
    </script>
</body>
</html>
