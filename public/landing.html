<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LǐRénXīn API — Free REST API by Akito Hidata</title>

    <meta name="description" content="LǐRénXīn API: REST API gratis berisi downloader, games, info cuaca & gempa, search, dan tools. Dibuat oleh Akito Hidata (Taufik Hidayat).">
    <meta name="keywords" content="LirenxinAPI, Akito Hidata, Taufik Hidayat, API gratis, REST API Indonesia, downloader API, games API">
    <meta name="author" content="Taufik Hidayat (Akito Hidata)">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="google-site-verification" content="googlecd1c0a59ae0970d6" />

    <link rel="canonical" href="https://lirenxin-api.my.id/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="LǐRénXīn API">
    <meta property="og:title" content="LǐRénXīn API — Free REST API">
    <meta property="og:description" content="REST API gratis: downloader, games, info, search, dan tools. Coba langsung dari halaman dokumentasi.">
    <meta property="og:url" content="https://lirenxin-api.my.id/">
    <meta property="og:image" content="https://lirenxin-api.my.id/src/thumbnail.jpg">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="LǐRénXīn API — Free REST API">
    <meta name="twitter:description" content="REST API gratis: downloader, games, info, search, dan tools.">
    <meta name="twitter:image" content="https://lirenxin-api.my.id/src/thumbnail.jpg">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Taufik Hidayat",
      "alternateName": ["Akito Hidata", "Lirenxin"],
      "url": "https://lirenxin-api.my.id",
      "jobTitle": "student",
      "sameAs": [
        "https://github.com/akitohidata211228",
        "https://www.instagram.com/akito_hidata?igsh=ZmxqbXBxcWV3ZXll",
        "https://www.tiktok.com/@lirenxin2112?_r=1&_t=ZS-94Cs2vY6cTd"
      ]
    }
    </script>

    <link id="favicon" rel="icon" href="/src/danzz.jpg">
    <script src="theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;0,800;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                        display: ['"Space Mono"', 'monospace']
                    },
                    /* Warna diambil dari token style.css, bukan hardcode lagi */
                    colors: {
                        brand: 'var(--brand)',
                        'brand-strong': 'var(--brand-strong)',
                        ink: 'var(--ink)',
                        'ink-soft': 'var(--ink-soft)',
                        'ink-faint': 'var(--ink-faint)',
                        surface: 'var(--surface)',
                        'surface-sunk': 'var(--surface-sunk)',
                        line: 'var(--line)',
                        'line-soft': 'var(--line-soft)'
                    }
                }
            }
        }
    </script>
</head>
<body class="grid-bg min-h-screen flex items-center justify-center font-mono p-4 selection:bg-brand selection:text-white">

    <main class="panel w-full max-w-md overflow-hidden animate-rise">

        <header class="px-4 py-3 flex justify-between items-center border-b-2" style="border-color: var(--line); background: linear-gradient(90deg, var(--brand), var(--sky));">
            <div class="flex gap-2" aria-hidden="true">
                <span class="w-3 h-3 rounded-full bg-red-400 border border-white/30"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-400 border border-white/30"></span>
                <span class="w-3 h-3 rounded-full bg-green-400 border border-white/30"></span>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs font-bold tracking-widest text-white/90 flex items-center gap-2">
                    <i class="fa-solid fa-terminal text-[10px]"></i> my_idol
                </span>
                <button onclick="flipTheme(this)" title="Ganti tema" aria-label="Ganti tema"
                    class="w-7 h-7 rounded border border-white/40 bg-white/15 text-white hover:bg-white/30 transition-colors flex items-center justify-center">
                    <i class="fa-solid fa-moon text-[11px]"></i>
                </button>
            </div>
        </header>

        <div class="p-6">

            <div id="loader" class="flex flex-col gap-4" aria-busy="true">
                <div class="w-full aspect-video skeleton"></div>
                <div class="h-8 w-3/4 skeleton"></div>
                <div class="h-4 w-full skeleton"></div>
                <div class="h-4 w-2/3 skeleton"></div>
                <div class="h-12 w-full mt-2 skeleton"></div>
            </div>

            <div id="content" class="hidden flex-col items-center">

                <div class="w-full aspect-video border-2 mb-6 relative overflow-hidden rounded-lg group/image"
                     style="border-color: var(--line-soft); background: var(--surface-sunk);">
                    <img id="dash-thumb" src="" alt="Thumbnail LǐRénXīn API"
                        class="w-full h-full object-cover transition-transform duration-500 group-hover/image:scale-105">
                </div>

                <div class="w-full text-left mb-6">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="w-1 h-6 rounded-full" style="background: linear-gradient(180deg, var(--brand), var(--sky));"></span>
                        <h1 id="dash-title" class="text-2xl font-display font-bold uppercase tracking-tighter leading-none italic text-ink"></h1>
                    </div>
                    <p id="dash-desc" class="text-sm leading-relaxed p-3 rounded border text-ink-soft"
                       style="border-color: var(--line-soft); background: var(--brand-wash);"></p>
                </div>

                <!-- Statistik nyata, dihitung dari config + proses server -->
                <div class="grid grid-cols-3 gap-2 w-full mb-6">
                    <div class="border-2 rounded-lg p-2 text-center" style="border-color: var(--line-soft);">
                        <div id="stat-endpoints" class="text-xl font-bold font-display" style="color: var(--brand);">–</div>
                        <div class="text-[9px] font-bold uppercase tracking-wider text-ink-faint">Endpoint</div>
                    </div>
                    <div class="border-2 rounded-lg p-2 text-center" style="border-color: var(--line-soft);">
                        <div id="stat-categories" class="text-xl font-bold font-display" style="color: var(--brand);">–</div>
                        <div class="text-[9px] font-bold uppercase tracking-wider text-ink-faint">Kategori</div>
                    </div>
                    <div class="border-2 rounded-lg p-2 text-center" style="border-color: var(--line-soft);">
                        <div id="stat-uptime" class="text-xl font-bold font-display" style="color: var(--brand);">–</div>
                        <div class="text-[9px] font-bold uppercase tracking-wider text-ink-faint">Uptime</div>
                    </div>
                </div>

                <a href="/docs" class="press w-full block text-white font-bold py-4 text-base text-center border-2 rounded-lg mb-4 group/btn"
                   style="border-color: var(--line); background: linear-gradient(90deg, var(--brand), var(--sky)); box-shadow: var(--shadow);">
                    <span class="flex items-center justify-center gap-3">
                        <i class="fa-solid fa-book-open text-lg transition-transform duration-300 group-hover/btn:-rotate-6"></i>
                        <span class="tracking-wider">READ DOCS</span>
                        <i class="fa-solid fa-arrow-right text-sm group-hover/btn:translate-x-1 transition-transform"></i>
                    </span>
                </a>

                <div class="grid grid-cols-2 gap-4 w-full mb-6">
                    <a id="btn-channel" href="#" target="_blank" rel="noopener"
                       class="press flex items-center justify-center gap-3 border-2 py-3 text-sm font-bold rounded-lg"
                       style="border-color: var(--line); background: var(--surface); box-shadow: var(--shadow-sm);">
                        <i class="fa-brands fa-whatsapp text-lg" style="color: var(--brand);"></i>
                        <span class="text-xs text-ink">WhatsApp</span>
                    </a>
                    <a id="btn-source" href="#" target="_blank" rel="noopener"
                       class="press flex items-center justify-center gap-3 border-2 py-3 text-sm font-bold rounded-lg"
                       style="border-color: var(--line); background: var(--surface); box-shadow: var(--shadow-sm);">
                        <i class="fa-brands fa-github text-lg" style="color: var(--brand);"></i>
                        <span class="text-xs text-ink">Github</span>
                    </a>
                </div>

                <footer class="text-xs font-bold w-full border-t-2 pt-4 flex justify-between items-center uppercase tracking-wider"
                        style="border-color: var(--line-soft); color: var(--ink-faint);">
                    <span class="flex items-center gap-2">
                        <span class="relative flex w-2 h-2">
                            <span class="absolute w-2 h-2 rounded-full bg-green-500 animate-ping"></span>
                            <span class="w-2 h-2 rounded-full bg-green-500"></span>
                        </span>
                        <span id="dash-ver">v1.1</span>
                    </span>
                    <span class="font-display italic flex items-center gap-2">
                        <i class="fa-solid fa-heart text-red-400"></i> Zhao Lusi
                    </span>
                </footer>
            </div>
        </div>
    </main>

    <script>
        function flipTheme(btn) {
            const mode = window.LirenxinTheme.toggle();
            btn.querySelector('i').className = mode === 'dark'
                ? 'fa-solid fa-sun text-[11px]'
                : 'fa-solid fa-moon text-[11px]';
        }

        (function syncThemeIcon() {
            const icon = document.querySelector('header button i');
            if (icon && window.LirenxinTheme.current() === 'dark') {
                icon.className = 'fa-solid fa-sun text-[11px]';
            }
        })();

        function humanUptime(sec) {
            if (sec < 60) return sec + 's';
            if (sec < 3600) return Math.floor(sec / 60) + 'm';
            if (sec < 86400) return Math.floor(sec / 3600) + 'h';
            return Math.floor(sec / 86400) + 'd';
        }

        const MIN_LOAD = 400;
        const startLoad = Date.now();

        fetch('/config')
            .then(res => res.json())
            .then(config => {
                const s = config.settings;
                const stats = config.stats || {};

                document.getElementById('dash-title').innerText = s.apiName;
                document.getElementById('dash-desc').innerText = s.description;
                document.getElementById('dash-ver').innerText = s.apiVersion;

                document.getElementById('stat-endpoints').innerText = stats.endpoints ?? '–';
                document.getElementById('stat-categories').innerText = stats.categories ?? '–';
                document.getElementById('stat-uptime').innerText =
                    stats.uptimeSeconds != null ? humanUptime(stats.uptimeSeconds) : '–';

                const btnChannel = document.getElementById('btn-channel');
                if (s.channelUrl) btnChannel.href = s.channelUrl;
                else btnChannel.classList.add('opacity-50', 'pointer-events-none');

                const btnSource = document.getElementById('btn-source');
                if (s.github) btnSource.href = s.github;
                else btnSource.classList.add('opacity-50', 'pointer-events-none');

                document.getElementById('dash-thumb').src = s.thumbnail || '/src/thumbnail.jpg';
                if (s.favicon) document.getElementById('favicon').href = s.favicon;

                setTimeout(() => {
                    document.getElementById('loader').classList.add('hidden');
                    const content = document.getElementById('content');
                    content.classList.remove('hidden');
                    content.classList.add('flex', 'animate-rise');
                }, Math.max(0, MIN_LOAD - (Date.now() - startLoad)));
            })
            .catch(err => {
                console.error(err);
                document.getElementById('loader').innerHTML = `
                    <div class="border-2 border-red-400 p-4 text-center rounded-lg" style="background: var(--surface);">
                        <h2 class="font-bold text-red-500 mb-1 font-display">SYSTEM ERROR</h2>
                        <p class="text-xs text-red-400">Gagal memuat konfigurasi.</p>
                        <button onclick="location.reload()" class="mt-3 px-3 py-1 bg-red-500 text-white text-xs rounded border border-red-600">
                            COBA LAGI
                        </button>
                    </div>`;
            });
    </script>
</body>
</html>
