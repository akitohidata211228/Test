<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documentation | LǐRénXīn API</title>

    <meta name="description" content="Dokumentasi LǐRénXīn API. Coba semua endpoint langsung dari browser: downloader, games, info cuaca & gempa, search, dan tools.">
    <meta name="author" content="Akito Hidata">
    <meta name="theme-color" content="#8b5cf6">

    <link rel="canonical" href="https://lirenxin-api.my.id/docs">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="LǐRénXīn API">
    <meta property="og:title" content="LǐRénXīn API Documentation">
    <meta property="og:description" content="Coba semua endpoint LǐRénXīn API langsung dari browser.">
    <meta property="og:url" content="https://lirenxin-api.my.id/docs">
    <meta property="og:image" content="https://lirenxin-api.my.id/src/thumbnail.jpg">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="LǐRénXīn API Documentation">
    <meta name="twitter:description" content="Coba semua endpoint LǐRénXīn API langsung dari browser.">
    <meta name="twitter:image" content="https://lirenxin-api.my.id/src/thumbnail.jpg">

    <link rel="icon" href="/src/danzz.jpg">
    <script src="theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700;800&display=swap">
    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                        display: ['"Space Mono"', 'monospace']
                    },
                    colors: {
                        brand: 'var(--brand)',
                        'brand-strong': 'var(--brand-strong)',
                        ink: 'var(--ink)',
                        'ink-soft': 'var(--ink-soft)',
                        'ink-faint': 'var(--ink-faint)',
                        surface: 'var(--surface)',
                        'surface-sunk': 'var(--surface-sunk)',
                        line: 'var(--line)',
                        'line-soft': 'var(--line-soft)'
                    }
                }
            }
        }
    </script>
</head>
<body class="grid-bg min-h-screen flex flex-col font-mono text-ink">

    <nav class="border-b-2 sticky top-0 z-50 backdrop-blur"
         style="border-color: var(--line); background: color-mix(in srgb, var(--surface) 88%, transparent);">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center gap-4 justify-between">

            <div class="flex items-center gap-3 shrink-0">
                <a href="/" aria-label="Kembali ke beranda"
                   class="press w-10 h-10 text-white flex items-center justify-center border-2 rounded"
                   style="border-color: var(--line); background: var(--brand); box-shadow: var(--shadow-sm);">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 id="nav-title" class="font-display font-bold text-xl tracking-tighter uppercase italic" style="color: var(--brand);">LǐRénXīn API</h1>
            </div>

            <div class="hidden md:flex flex-1 max-w-xl mx-4 h-9 border-2 items-center overflow-hidden rounded"
                 style="border-color: var(--line); background: var(--term-bg);">
                <div id="running-text" class="text-white text-xs font-bold uppercase tracking-widest px-4 whitespace-nowrap animate-marquee inline-block min-w-full"></div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <button onclick="flipTheme(this)" title="Ganti tema" aria-label="Ganti tema"
                    class="press w-10 h-10 border-2 rounded flex items-center justify-center"
                    style="border-color: var(--line); background: var(--surface); box-shadow: var(--shadow-sm); color: var(--brand);">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <a href="https://github.com/akitohidata211228" target="_blank" rel="noopener" aria-label="GitHub"
                   class="press w-10 h-10 border-2 rounded flex items-center justify-center"
                   style="border-color: var(--line); background: var(--surface); box-shadow: var(--shadow-sm); color: var(--brand);">
                    <i class="fa-brands fa-github text-xl"></i>
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-8 grid lg:grid-cols-12 gap-8 items-start">

        <aside class="lg:col-span-4 lg:sticky lg:top-24 flex flex-col gap-6 h-fit">

            <div class="panel term overflow-hidden flex flex-col h-[340px]">
                <div class="term-head px-3 py-2 flex items-center gap-2 border-b border-white/10">
                    <span class="flex gap-1.5" aria-hidden="true">
                        <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                        <span class="w-2.5 h-2.5 rounded-full bg-yellow-500"></span>
                        <span class="w-2.5 h-2.5 rounded-full bg-green-500"></span>
                    </span>
                    <span class="text-[10px] text-gray-400 font-bold ml-2">index.ts</span>
                </div>

                <div id="term-logs" class="p-3 text-[11px] overflow-y-auto flex-1 space-y-0.5 crt-text" style="color: var(--term-text);"></div>

                <div id="term-input-line" class="hidden px-3 pb-2 pt-1 border-t border-white/10">
                    <span class="text-green-500 font-bold mr-1 text-[10px]">root@LǐRénXīn~$</span>
                    <span class="inline-block w-2.5 h-4 bg-gray-500 align-middle ml-1 animate-blink"></span>
                </div>
            </div>

            <div class="relative">
                <input type="search" id="search-input" placeholder="CARI ENDPOINT..." aria-label="Cari endpoint"
                    class="field h-12 pl-10 font-bold text-sm uppercase" style="border-color: var(--line); box-shadow: var(--shadow);">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" style="color: var(--brand);"></i>
            </div>

            <div class="panel p-5">
                <h2 class="font-bold text-lg italic mb-4 border-b-2 border-dashed pb-2" style="color: var(--brand); border-color: var(--line-soft);">
                    SERVER STATUS
                </h2>
                <dl class="space-y-3 text-xs font-bold">
                    <div class="flex justify-between">
                        <dt class="text-ink-faint">TIME (WIB)</dt>
                        <dd id="server-time" class="text-ink">--:--:--</dd>
                    </div>
                    <div class="flex justify-between">
                        <dt class="text-ink-faint">DATE</dt>
                        <dd id="server-date" class="text-ink">--/--/----</dd>
                    </div>
                    <div class="flex justify-between">
                        <dt class="text-ink-faint">ENDPOINT</dt>
                        <dd id="stat-endpoints" style="color: var(--brand);">–</dd>
                    </div>
                    <div class="flex justify-between">
                        <dt class="text-ink-faint">KATEGORI</dt>
                        <dd id="stat-categories" style="color: var(--brand);">–</dd>
                    </div>
                    <div class="flex justify-between">
                        <dt class="text-ink-faint">UPTIME</dt>
                        <dd id="stat-uptime" style="color: var(--brand);">–</dd>
                    </div>
                </dl>
            </div>
        </aside>

        <section class="lg:col-span-8 min-h-[50vh]">
            <div id="api-container" class="space-y-4 opacity-0 transition-opacity duration-500"></div>

            <div id="no-results" class="hidden flex-col items-center justify-center py-20 text-center">
                <i class="fa-solid fa-box-open text-4xl mb-3" style="color: var(--brand);"></i>
                <p class="font-bold text-xl" style="color: var(--brand);">TIDAK ADA HASIL</p>
            </div>
        </section>

    </main>

    <div id="custom-toast" class="fixed bottom-5 right-5 z-[100] translate-y-32 opacity-0 transition-all duration-300" role="status" aria-live="polite">
        <div class="px-4 py-3 font-bold text-xs rounded flex items-center gap-3 border-2 text-white"
             style="border-color: var(--line); background: var(--brand); box-shadow: var(--shadow);">
            <i class="fa-solid fa-check"></i>
            <span id="toast-message">SUCCESS</span>
        </div>
    </div>

    <script>
        function flipTheme(btn) {
            const mode = window.LirenxinTheme.toggle();
            btn.querySelector('i').className = mode === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }
        (function () {
            const icon = document.querySelector('nav button i');
            if (icon && window.LirenxinTheme.current() === 'dark') icon.className = 'fa-solid fa-sun';
        })();
    </script>
    <script src="script.js"></script>
</body>
</html>
